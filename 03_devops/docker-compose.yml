x-service-environment: &service-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-django-secret-key}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  SERVICE_DB_HOST: db
  SERVICE_DB_PORT: 3306
  SERVICE_DB_USER: ${FOOD_DELIVER_DB_USER:-foodapp}
  SERVICE_DB_PASSWORD: ${FOOD_DELIVER_DB_PASSWORD:-change-this-database-password}
  USER_DB_NAME: ${USER_DB_NAME:-user_db}
  TRADE_DB_NAME: ${TRADE_DB_NAME:-trade_db}
  LIFESTYLE_DB_NAME: ${LIFESTYLE_DB_NAME:-life_db}
  JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-this-internal-token}
  APP_VERSION: ${APP_VERSION:-compose-dev}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-mysql-root-password}
      MYSQL_DATABASE: ${FOOD_DELIVER_DB_NAME:-the_food_mas2}
      MYSQL_USER: ${FOOD_DELIVER_DB_USER:-foodapp}
      MYSQL_PASSWORD: ${FOOD_DELIVER_DB_PASSWORD:-change-this-database-password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/seed.sql:/docker-entrypoint-initdb.d/01-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-init:
    image: mysql:8.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-mysql-root-password}
      MYSQL_USER: ${FOOD_DELIVER_DB_USER:-foodapp}
      MYSQL_PASSWORD: ${FOOD_DELIVER_DB_PASSWORD:-change-this-database-password}
      USER_DB_NAME: ${USER_DB_NAME:-user_db}
      TRADE_DB_NAME: ${TRADE_DB_NAME:-trade_db}
      LIFESTYLE_DB_NAME: ${LIFESTYLE_DB_NAME:-life_db}
    volumes:
      - ./data/init-microservice-schemas.sh:/scripts/init-microservice-schemas.sh:ro
    entrypoint: ["sh", "/scripts/init-microservice-schemas.sh"]

  web:
    image: food-master-bff:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: 03_devops/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-compose-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-this-django-secret-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-False}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_STATIC_ROOT: /app/staticfiles
      FOOD_DELIVER_DB_NAME: ${FOOD_DELIVER_DB_NAME:-the_food_mas2}
      FOOD_DELIVER_DB_USER: ${FOOD_DELIVER_DB_USER:-foodapp}
      FOOD_DELIVER_DB_PASSWORD: ${FOOD_DELIVER_DB_PASSWORD:-change-this-database-password}
      FOOD_DELIVER_DB_HOST: db
      FOOD_DELIVER_DB_PORT: 3306
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
      ALIYUN_BASE_URL: ${ALIYUN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      APP_VERSION: ${APP_VERSION:-compose-dev}
    volumes:
      - staticfiles:/app/staticfiles
      - ../01_source/static:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  user-service:
    image: food-master-user:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: 03_devops/services/Dockerfile
      args:
        SERVICE_MODULE: user_service
        SERVICE_PORT: 8001
        APP_VERSION: ${APP_VERSION:-compose-dev}
    restart: unless-stopped
    depends_on:
      schema-init:
        condition: service_completed_successfully
    environment:
      <<: *service-environment
      SERVICE_MODULE: user_service
      SERVICE_PORT: 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  trade-service:
    image: food-master-trade:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: 03_devops/services/Dockerfile
      args:
        SERVICE_MODULE: trade_service
        SERVICE_PORT: 8002
        APP_VERSION: ${APP_VERSION:-compose-dev}
    restart: unless-stopped
    depends_on:
      schema-init:
        condition: service_completed_successfully
    environment:
      <<: *service-environment
      SERVICE_MODULE: trade_service
      SERVICE_PORT: 8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  lifestyle-service:
    image: food-master-lifestyle:${APP_VERSION:-local}
    build:
      context: ..
      dockerfile: 03_devops/services/Dockerfile
      args:
        SERVICE_MODULE: lifestyle_service
        SERVICE_PORT: 8003
        APP_VERSION: ${APP_VERSION:-compose-dev}
    restart: unless-stopped
    depends_on:
      schema-init:
        condition: service_completed_successfully
    environment:
      <<: *service-environment
      SERVICE_MODULE: lifestyle_service
      SERVICE_PORT: 8003
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      user-service:
        condition: service_healthy
      trade-service:
        condition: service_healthy
      lifestyle-service:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - ../01_source/static:/app/static:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/live/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:
  staticfiles:
