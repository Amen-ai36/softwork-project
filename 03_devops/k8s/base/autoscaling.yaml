apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: food-master-user
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-master-user
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
