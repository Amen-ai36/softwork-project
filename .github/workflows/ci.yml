name: CI/CD - microservices test, images, Kubernetes
run-name: CI/CD | ${{ github.ref_name }} | ${{ github.sha }}

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: food-master-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  packages: write

jobs:
  format-check:
    name: 01 Quality - formatting and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: 01_source/requirements-dev.txt
      - name: Install formatting tools
        run: python -m pip install -r 01_source/requirements-dev.txt
      - name: Check Python formatting
        run: >-
          python -m black --check --config 01_source/pyproject.toml
          01_source/manage.py 01_source/food_master 01_source/myapp
          01_source/services 04_tests/tests 04_tests/performance
          03_devops/scripts/package_submission.py

  legacy-test:
    name: 02 Test - BFF on ${{ matrix.os }}
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: 01_source/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r 01_source/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q 01_source/food_master 01_source/myapp 01_source/services 04_tests/tests
      - name: Run Django deployment checks
        run: python manage.py check --deploy --settings=food_master.test_settings
        working-directory: 01_source
        env:
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_CSRF_COOKIE_SECURE: "True"
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-check-only-not-a-production-secret-0123456789-abcdef
          DJANGO_SECURE_HSTS_SECONDS: "3600"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
          DJANGO_SECURE_SSL_REDIRECT: "True"
          DJANGO_SESSION_COOKIE_SECURE: "True"
      - name: Run legacy unit, integration/API, and end-to-end tests
        run: python 04_tests/tests/run_tests.py
      - name: Publish representative acceptance cases
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: cat 04_tests/tests/acceptance_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload legacy test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-test-report-${{ matrix.os }}
          path: |
            04_tests/tests/test_report.md
            04_tests/tests/test_report.json
            04_tests/tests/acceptance_report.md
            04_tests/tests/acceptance_report.json
          if-no-files-found: warn
          retention-days: 30

  service-test:
    name: 02 Test - ${{ matrix.name }} on ${{ matrix.os }}
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: user-service
            settings: services.user_service.config.settings
            tests: services.user_service.users
            app: user_service_users
          - os: windows-latest
            name: user-service
            settings: services.user_service.config.settings
            tests: services.user_service.users
            app: user_service_users
          - os: macos-latest
            name: user-service
            settings: services.user_service.config.settings
            tests: services.user_service.users
            app: user_service_users
          - os: ubuntu-latest
            name: trade-service
            settings: services.trade_service.config.settings
            tests: services.trade_service.trade
            app: trade_service_trade
          - os: windows-latest
            name: trade-service
            settings: services.trade_service.config.settings
            tests: services.trade_service.trade
            app: trade_service_trade
          - os: macos-latest
            name: trade-service
            settings: services.trade_service.config.settings
            tests: services.trade_service.trade
            app: trade_service_trade
          - os: ubuntu-latest
            name: lifestyle-service
            settings: services.lifestyle_service.config.settings
            tests: services.lifestyle_service.lifestyle
            app: lifestyle_service_lifestyle
          - os: windows-latest
            name: lifestyle-service
            settings: services.lifestyle_service.config.settings
            tests: services.lifestyle_service.lifestyle
            app: lifestyle_service_lifestyle
          - os: macos-latest
            name: lifestyle-service
            settings: services.lifestyle_service.config.settings
            tests: services.lifestyle_service.lifestyle
            app: lifestyle_service_lifestyle
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: 01_source/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r 01_source/requirements.txt
      - name: Check MySQL driver compatibility
        run: python -c "import services; import MySQLdb"
        working-directory: 01_source
      - name: Check committed migrations
        run: python -m django makemigrations ${{ matrix.app }} --check --dry-run --settings=${{ matrix.settings }}
        working-directory: 01_source
        env:
          SERVICE_USE_SQLITE: "true"
      - name: Run isolated service API tests
        run: python -m django test ${{ matrix.tests }} --settings=${{ matrix.settings }} -v 2
        working-directory: 01_source
        env:
          SERVICE_USE_SQLITE: "true"
          DJANGO_SECRET_KEY: ci-service-secret
          JWT_SECRET: ci-shared-jwt-secret

  test-gate:
    name: 02 Test gate - all regression suites passed
    needs: [legacy-test, service-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: 01_source/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r 01_source/requirements.txt
      - name: Generate consolidated API contract evidence
        run: python 04_tests/tests/run_service_tests.py
      - name: Publish API contract summary
        if: always()
        shell: bash
        run: cat 04_tests/tests/microservice_test_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microservice-api-contract-report
          path: |
            04_tests/tests/microservice_test_report.md
            04_tests/tests/microservice_test_report.json
          if-no-files-found: error
          retention-days: 30

  bff-image:
    name: 03 Build - BFF image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize registry path
        id: registry
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish BFF
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./03_devops/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.registry.outputs.base }}-bff:${{ github.sha }}
            ${{ steps.registry.outputs.base }}-bff:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff

  service-images:
    name: 03 Build - ${{ matrix.name }} image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-service
            image: user
            module: user_service
            port: 8001
          - name: trade-service
            image: trade
            module: trade_service
            port: 8002
          - name: lifestyle-service
            image: lifestyle
            module: lifestyle_service
            port: 8003
    steps:
      - uses: actions/checkout@v6
      - name: Normalize registry path
        id: registry
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./03_devops/services/Dockerfile
          push: true
          build-args: |
            SERVICE_MODULE=${{ matrix.module }}
            SERVICE_PORT=${{ matrix.port }}
            APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.registry.outputs.base }}-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.registry.outputs.base }}-${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-kind:
    name: 04 Deploy + 05 Verify - Kubernetes
    needs: [bff-image, service-images]
    runs-on: ubuntu-latest
    environment: kubernetes-ci
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull images produced by this workflow
        shell: bash
        run: |
          REPOSITORY_LOWER="${GITHUB_REPOSITORY,,}"
          for component in bff user trade lifestyle; do
            docker pull "ghcr.io/${REPOSITORY_LOWER}-${component}:${GITHUB_SHA}"
            docker tag "ghcr.io/${REPOSITORY_LOWER}-${component}:${GITHUB_SHA}" "food-master-${component}:dev"
          done
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: food-master-ci
          wait: 120s
      - name: Load exact images into Kind
        run: |
          kind load docker-image food-master-bff:dev --name food-master-ci
          kind load docker-image food-master-user:dev --name food-master-ci
          kind load docker-image food-master-trade:dev --name food-master-ci
          kind load docker-image food-master-lifestyle:dev --name food-master-ci
      - name: Create runtime secrets
        shell: bash
        run: |
          kubectl apply -f 03_devops/k8s/base/namespace.yaml
          DB_PASSWORD="$(openssl rand -hex 16)"
          DJANGO_SECRET="$(openssl rand -hex 32)"
          JWT_SECRET="$(openssl rand -hex 32)"
          INTERNAL_TOKEN="$(openssl rand -hex 32)"
          kubectl -n food-master create secret generic food-master-secrets \
            --from-literal="DJANGO_SECRET_KEY=$DJANGO_SECRET" \
            --from-literal="MYSQL_ROOT_PASSWORD=$DB_PASSWORD" \
            --from-literal="FOOD_DELIVER_DB_PASSWORD=$DB_PASSWORD" \
            --from-literal="JWT_SECRET=$JWT_SECRET" \
            --from-literal="INTERNAL_SERVICE_TOKEN=$INTERNAL_TOKEN"
      - name: Deploy gateway, BFF, services, and database
        shell: bash
        run: |
          diagnose() {
            echo "::group::Kubernetes resources"
            kubectl -n food-master get all,pvc -o wide || true
            echo "::endgroup::"
            echo "::group::Kubernetes events"
            kubectl -n food-master get events --sort-by=.lastTimestamp || true
            echo "::endgroup::"
            for component in db web user trade lifestyle nginx; do
              echo "::group::${component} logs"
              kubectl -n food-master logs "deployment/food-master-${component}" --tail=200 || true
              echo "::endgroup::"
            done
          }
          trap diagnose ERR
          kubectl apply -k 03_devops/k8s/base
          for deployment in food-master-web food-master-user food-master-trade food-master-lifestyle; do
            kubectl -n food-master set env "deployment/${deployment}" APP_VERSION=${{ github.sha }}
          done
          kubectl -n food-master rollout status deployment/food-master-db --timeout=240s
          kubectl -n food-master wait --for=condition=complete job/food-master-schema-init --timeout=240s
          kubectl -n food-master rollout status deployment/food-master-web --timeout=360s
          kubectl -n food-master rollout status deployment/food-master-user --timeout=240s
          kubectl -n food-master rollout status deployment/food-master-trade --timeout=240s
          kubectl -n food-master rollout status deployment/food-master-lifestyle --timeout=240s
          kubectl -n food-master rollout status deployment/food-master-nginx --timeout=180s
      - name: Run gateway, service, and version checks
        shell: bash
        run: |
          diagnose() {
            cat port-forward.log 2>/dev/null || true
            kubectl -n food-master get deployments,pods -o wide || true
            kubectl -n food-master get events --sort-by=.lastTimestamp || true
            for component in web user trade lifestyle nginx; do
              echo "::group::${component} verification logs"
              kubectl -n food-master logs "deployment/food-master-${component}" --tail=200 || true
              echo "::endgroup::"
            done
          }
          kubectl -n food-master port-forward service/food-master-nginx 18080:80 >port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" 2>/dev/null || true' EXIT
          trap diagnose ERR
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready/ >health-bff.json; then break; fi
            if [ "$attempt" -eq 30 ]; then cat port-forward.log; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/health/live/ >live-bff.json
          curl --fail --silent http://127.0.0.1:18080/api/users/health/live >live-user.json
          curl --fail --silent http://127.0.0.1:18080/api/trade/health/live >live-trade.json
          curl --fail --silent http://127.0.0.1:18080/api/lifestyle/health/live >live-lifestyle.json
          curl --fail --silent http://127.0.0.1:18080/api/users/health/ready >health-user.json
          curl --fail --silent http://127.0.0.1:18080/api/trade/health/ready >health-trade.json
          curl --fail --silent http://127.0.0.1:18080/api/lifestyle/health/ready >health-lifestyle.json
          curl --fail --silent http://127.0.0.1:18080/health/version/ >version-bff.json
          curl --fail --silent http://127.0.0.1:18080/api/users/health/version >version-user.json
          curl --fail --silent http://127.0.0.1:18080/api/trade/health/version >version-trade.json
          curl --fail --silent http://127.0.0.1:18080/api/lifestyle/health/version >version-lifestyle.json
          grep --fixed-strings '"version": "${{ github.sha }}"' version-*.json
          cat live-*.json health-*.json version-*.json
          {
            echo "## 05 Verify - deployment accepted"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Images: BFF, user, trade, lifestyle"
            echo "- Probes: 4 live + 4 ready + 4 version checks passed"
            echo "- Version match: all applications report the deployed commit"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect Kubernetes evidence
        if: always()
        shell: bash
        run: |
          mkdir -p deployment-evidence
          kubectl -n food-master get all,pvc -o wide >deployment-evidence/resources.txt 2>&1 || true
          kubectl -n food-master describe pods >deployment-evidence/pods.txt 2>&1 || true
          for component in db web user trade lifestyle nginx; do
            kubectl -n food-master logs "deployment/food-master-${component}" --tail=500 >"deployment-evidence/${component}.log" 2>&1 || true
          done
          cp live-*.json health-*.json version-*.json port-forward.log deployment-evidence/ 2>/dev/null || true
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: microservices-deployment-${{ github.sha }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30
