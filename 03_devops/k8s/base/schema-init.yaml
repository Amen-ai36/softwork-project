apiVersion: batch/v1
kind: Job
metadata:
  name: food-master-schema-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: schema-init
        app.kubernetes.io/name: food-master-schema-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-init
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: food-master-secrets
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h food-master-db -uroot -p"${MYSQL_ROOT_PASSWORD}" --silent; do sleep 2; done
              MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql -h food-master-db -uroot -e "
                CREATE DATABASE IF NOT EXISTS user_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
                CREATE DATABASE IF NOT EXISTS trade_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
                CREATE DATABASE IF NOT EXISTS life_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              "
