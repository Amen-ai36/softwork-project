apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-master-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/name: food-master-web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend
        app.kubernetes.io/name: food-master-web
    spec:
      containers:
        - name: web
          image: food-master:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: food-master-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: food-master-secrets
                  key: DJANGO_SECRET_KEY
            - name: FOOD_DELIVER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: food-master-secrets
                  key: FOOD_DELIVER_DB_PASSWORD
            - name: ALIYUN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: food-master-secrets
                  key: ALIYUN_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live/
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: food-master-web
spec:
  selector:
    app.kubernetes.io/name: food-master-web
  ports:
    - name: http
      port: 8000
      targetPort: http
