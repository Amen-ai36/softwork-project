{% extends "app_base.html" %}

{% block title %}订单评价 · Life Master{% endblock %}
{% block page_title %}订单评价{% endblock %}

{% block content %}
<div class="page-title-bar">
    <div>
        <h1>⭐ 订单评价</h1>
        <div class="page-sub">为 {{ orders.food.name }} 打上您的专属评分</div>
    </div>
</div>

<div class="panel-card form-card">
    <div class="filter-header">
        <div class="cell-main">
            <span class="tag tag-blue">🍽️ {{ orders.food.name }}</span>
            <span class="tag tag-gray">订单 #{{ orders.id }}</span>
        </div>
    </div>
    <div class="form-card-body">
        <form action="/ordercomment/?orderid={{ orders.id }}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="scoretofood">🍲 菜品评分 (0.1 ~ 5.0) *</label>
                <input type="number" class="form-control" id="scoretofood" name="scoretofood" min="0.1" max="5.0" step="0.1" required placeholder="例如 4.5">
            </div>
            <div class="form-group">
                <label for="scoretodeliver">🚚 配送评分 (0.1 ~ 5.0) *</label>
                <input type="number" class="form-control" id="scoretodeliver" name="scoretodeliver" min="0.1" max="5.0" step="0.1" required placeholder="例如 4.8">
            </div>
            <div class="form-group">
                <label for="comment">💬 文字评论（不超过200字）</label>
                <textarea class="form-control" id="comment" name="comment" rows="4" placeholder="分享您的用餐体验..." maxlength="200"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">⭐ 提交评价</button>
                <a href="/space/" class="btn btn-default">👤 返回个人中心</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
