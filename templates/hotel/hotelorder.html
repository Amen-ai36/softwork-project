{% extends "app_base.html" %}

{% block title %}确认订房 · {{ hotel.name }} | Life Master{% endblock %}
{% block page_title %}确认订房{% endblock %}

{% block content %}
<div class="page-title-bar">
    <div>
        <h1>📅 确认订房</h1>
        <div class="page-sub">正在预订：{{ hotel.name }}</div>
    </div>
    <div class="page-actions">
        <a href="/hoteldetails/?hotelid={{ hotel.id }}" class="btn btn-default">🔙 返回详情</a>
    </div>
</div>

<div class="panel-card form-card">
    <div class="filter-header">
        <div class="cell-main">
            <span class="tag tag-blue">🏨 {{ hotel.name }}</span>
        </div>
    </div>
    <div class="form-card-body">
        <form action="/hotelorder/?userid={{ user_id }}&hotelid={{ hotel.id }}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="checkin_time">📅 预约入住时间 *</label>
                <input type="datetime-local" class="form-control" id="checkin_time" name="checkin_time" required>
            </div>
            <div class="form-group">
                <label for="duration">⏱️ 入住时间长度 *</label>
                <input type="number" class="form-control" id="duration" name="duration" required min="1" placeholder="钟点房填小时数，日租房填天数">
                <p class="form-hint">钟点房按小时计算，日租房按天数计算</p>
            </div>
            <div class="form-group">
                <label for="room_type">🛏️ 房型 *</label>
                <select id="room_type" class="form-control" name="room_type" required>
                    <option value="" disabled selected>请选择房型</option>
                    {% if hotel.price_clock %}
                    <option value="single_clock">单人间钟点房 · ¥{{ hotel.price_clock }}/小时</option>
                    {% endif %}
                    {% if hotel.price_day %}
                    <option value="single_day">单人间日租 · ¥{{ hotel.price_day }}/天</option>
                    {% endif %}
                    {% if hotel.price_double_clock %}
                    <option value="double_clock">双人间钟点房 · ¥{{ hotel.price_double_clock }}/小时</option>
                    {% endif %}
                    {% if hotel.price_double_day %}
                    <option value="double_day">双人间日租 · ¥{{ hotel.price_double_day }}/天</option>
                    {% endif %}
                    {% if hotel.price_special %}
                    <option value="special_day">特色房日租 · ¥{{ hotel.price_special }}/天</option>
                    {% endif %}
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ 提交订单</button>
                <a href="/hoteldetails/?hotelid={{ hotel.id }}" class="btn btn-default">🔙 我再想想</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
