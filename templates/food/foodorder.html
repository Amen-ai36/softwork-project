{% extends "app_base.html" %}

{% block title %}确认订单 · {{ food.name }} | Life Master{% endblock %}
{% block page_title %}确认下单{% endblock %}

{% block content %}
<div class="page-title-bar">
    <div>
        <h1>📝 确认下单</h1>
        <div class="page-sub">正在购买：{{ food.name }}</div>
    </div>
    <div class="page-actions">
        <a href="/fooddetails/?userid={{ user_id }}&foodid={{ food.id }}" class="btn btn-default">🔙 返回详情</a>
    </div>
</div>

<div class="panel-card form-card">
    <div class="filter-header">
        <div class="cell-main">
            <span class="tag tag-blue">🍽️ {{ food.name }}</span>
            <span class="td-price"><span class="td-price-symbol">¥</span>{{ food.price }}</span>
        </div>
    </div>
    <div class="form-card-body">
        <form action="/foodorder/?userid={{ user_id }}&foodid={{ food.id }}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="num">📦 数量</label>
                <input type="number" class="form-control" id="num" name="num" required min="1" placeholder="请输入份数">
            </div>
            <div class="form-group">
                <label for="address">📍 配送地址</label>
                <input type="text" class="form-control" id="address" name="address" required placeholder="请输入配送地址">
            </div>
            <div class="form-group">
                <label>🥢 下单方式</label>
                <div style="display:flex; gap:18px; flex-wrap:wrap; padding:4px 2px;">
                    <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-weight:500;">
                        <input type="radio" name="cutlery" value="1" checked> 立即下单
                    </label>
                    <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-weight:500;">
                        <input type="radio" name="cutlery" value="2"> 加入购物车
                    </label>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ 提交订单</button>
                <a href="/fooddetails/?userid={{ user_id }}&foodid={{ food.id }}" class="btn btn-default">🔙 我再想想</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
