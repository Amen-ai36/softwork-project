{% extends "app_base.html" %}

{% block title %}订房评价 · Life Master{% endblock %}
{% block page_title %}订房评价{% endblock %}

{% block content %}
<div class="page-title-bar">
    <div>
        <h1>⭐ 订房评价</h1>
        <div class="page-sub">为 {{ order.hotel.name }} 的入住体验打分</div>
    </div>
</div>

<div class="panel-card form-card">
    <div class="filter-header">
        <div class="cell-main">
            <span class="tag tag-blue">🏨 {{ order.hotel.name }}</span>
            <span class="tag tag-gray">订单 #{{ order.id }}</span>
        </div>
    </div>
    <div class="form-card-body">
        <form action="/hotelcomment/?orderid={{ order.id }}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="score">🏨 入住评分 (0.1 ~ 5.0) *</label>
                <input type="number" class="form-control" id="score" name="score" min="0.1" max="5.0" step="0.1" required placeholder="例如 4.5">
            </div>
            <div class="form-group">
                <label for="comment">💬 评论（不超过200字）</label>
                <textarea class="form-control" id="comment" name="comment" rows="4" placeholder="分享您的入住体验..." maxlength="200"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">⭐ 提交评价</button>
                <a href="/space/" class="btn btn-default">👤 返回个人中心</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
