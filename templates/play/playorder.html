{% extends "app_base.html" %}

{% block title %}购买门票 · {{ play.name }} | Life Master{% endblock %}
{% block page_title %}购买门票{% endblock %}

{% block content %}
<div class="page-title-bar">
    <div>
        <h1>🎫 购买门票</h1>
        <div class="page-sub">正在预订：{{ play.name }}</div>
    </div>
    <div class="page-actions">
        <a href="/playdetails/?playid={{ play.id }}" class="btn btn-default">🔙 返回详情</a>
    </div>
</div>

<div class="panel-card form-card">
    <div class="filter-header">
        <div class="cell-main">
            <span class="tag tag-blue">🎮 {{ play.name }}</span>
            <span class="td-sub">单价：<span class="td-price"><span class="td-price-symbol">¥</span>{{ play.price }}</span> / 张</span>
        </div>
    </div>
    <div class="form-card-body">
        <form action="/playorder/?userid={{ user_id }}&playid={{ play.id }}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="visit_time">📅 预定游玩时间 *</label>
                <input type="datetime-local" class="form-control" id="visit_time" name="visit_time" required>
            </div>
            <div class="form-group">
                <label for="num">🎫 购买票数 *</label>
                <input type="number" class="form-control" id="num" name="num" required min="1" placeholder="请输入购买数量">
                <p class="form-hint">最少购买 1 张</p>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ 提交订单</button>
                <a href="/playdetails/?playid={{ play.id }}" class="btn btn-default">🔙 我再想想</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
