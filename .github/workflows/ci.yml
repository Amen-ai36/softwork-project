name: CI - 自动化测试门禁

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: 自动化测试（单元/集成/端到端）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行全部测试并生成报告
        run: python test/run_tests.py

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test/test_report.md

  publish:
    name: 构建并发布镜像（测试通过后才会执行）
    needs: [test]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: 示例：构建 Docker 镜像
        run: |
          echo "TODO: docker build -t your-image . && docker push your-image"

  deploy:
    name: 部署（测试通过后才会执行）
    needs: [test]
    if: success()
    runs-on: ubuntu-latest
    steps:
