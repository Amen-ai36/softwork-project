upstream django_app {
    server web:8000;
}

upstream user_service {
    server user-service:8001;
}

upstream trade_service {
    server trade-service:8002;
}

upstream lifestyle_service {
    server lifestyle-service:8003;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    # Keep a dependency outage local to the affected API request.
    proxy_intercept_errors on;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
    error_page 502 504 = @service_unavailable;

    location @service_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"dependency service temporarily unavailable","fallback":true}';
    }

    location /static/images/ {
        alias /app/static/images/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    location /api/users/ {
        proxy_pass http://user_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/trade/ {
        proxy_pass http://trade_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/lifestyle/ {
        proxy_pass http://lifestyle_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
