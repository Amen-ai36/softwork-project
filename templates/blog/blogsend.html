{% extends "app_base.html" %}

{% block title %}发布博客 · Life Master{% endblock %}
{% block page_title %}发布博客{% endblock %}

{% block content %}
<div class="page-title-bar">
    <div>
        <h1>✍️ 发布博客</h1>
        <div class="page-sub">记录每一种味道</div>
    </div>
    <div class="page-actions">
        <a href="/blog" class="btn btn-default">🔙 返回博客空间</a>
    </div>
</div>

<div class="panel-card form-card">
    <div class="filter-header">
        <span style="font-size:13px; color:var(--text-secondary);">分享您的想法，让更多人看到</span>
    </div>
    <div class="form-card-body">
        <form action="/blogsend/?userid={{ user_id }}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">📌 博客标题 *</label>
                <input type="text" class="form-control" id="title" name="title" required placeholder="请输入博客标题(不超过30字)" maxlength="30">
            </div>
            <div class="form-group">
                <label for="content">📄 博客内容 *</label>
                <textarea class="form-control" id="content" name="content" rows="8" required placeholder="请输入博客内容"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ 一键发布</button>
                <a href="/blog" class="btn btn-default">🔙 我再想想</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
